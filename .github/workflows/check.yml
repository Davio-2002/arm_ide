name: Check

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # clang-tidy from apt.llvm.org: the same major version as on the developer's machine, so
      # CI and local runs report the same findings.
      - name: Install packages
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang clang-tidy-21 cmake ninja-build pkg-config \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user \
            libglfw3-dev libgl-dev libfreetype-dev libvterm-dev

      # Sources of the FetchContent dependencies; they change only with their pinned hashes.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            build-dev/_deps/*-src
            build-dev/_deps/*-subbuild
          key: deps-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset dev

      - name: Build
        id: build
        run: cmake --build --preset dev

      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ctest --preset dev

      # After the build: the sources include generated files from build-dev/generated.
      - name: clang-tidy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: run-clang-tidy-21 -p build-dev -quiet "$PWD/(src|tests)/"
